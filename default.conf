server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/html text/css application/javascript;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;

  # Las fotos se sirven tal cual. Sin esta regla caerian en el try_files de
  # abajo: una foto que falta devolveria la pagina entera con estado 200, que
  # el navegador pinta como imagen rota sin decir por que.
  #
  # Un dia de cache y no mas: los archivos se llaman siempre p5.jpg, asi que
  # un cache largo haria que cambiar una foto no se viera hasta que venza.
  location /img/ {
    try_files $uri =404;
    expires 1d;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / { try_files $uri /index.html; }
}
